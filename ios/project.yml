name: UltimateMusicWidget
options:
  bundleIdPrefix: com.sen0413
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  UltimateMusicWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - target: UltimateWidgetExtension
      - framework: Frameworks/SpotifyiOS.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sen0413.ultimatewidget
        PRODUCT_NAME: UltimateMusicWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ultimate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts: [SpaceGrotesk.ttf, DMSans.ttf]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: Play songs from your Music library and Apple Music in your hub playlists.
        LSApplicationQueriesSchemes: [spotify]
        CFBundleURLTypes:
          - CFBundleURLName: com.sen0413.ultimatewidget
            CFBundleURLSchemes: [ultimatewidget, umw]
    scheme: {}
  UltimateWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources/SpaceGrotesk.ttf
      - path: Resources/DMSans.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sen0413.ultimatewidget.widget
        PRODUCT_NAME: UltimateWidgetExtension
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ultimate Music Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [SpaceGrotesk.ttf, DMSans.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
